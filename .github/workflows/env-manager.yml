name: Environment Variable Manager

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  manage-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Python Validation
        run: |
          echo "🐍 Running Python validator..."
          if [ -f "examples/validate.py" ]; then
            # 智能处理：如果有 secrets 就用 secrets，否则用测试值
            if [ -n "${{ secrets.DB_HOST }}" ]; then
              echo "🔐 Using real secrets from repository"
              export DB_HOST="${{ secrets.DB_HOST }}"
              export API_KEY="${{ secrets.API_KEY }}"
            else
              echo "🧪 Using test values (secrets not configured or in PR)"
              export DB_HOST="localhost"
              export API_KEY="test_key_123"
            fi
            python examples/validate.py
          else
            echo "⚠️ Python script not found, skipping."
          fi


  build-and-push:
    needs: manage-env # 只有在验证通过后才构建
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 关键：允许推送镜像
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
