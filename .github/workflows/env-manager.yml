name: Environment Variable Manager

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  manage-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Multi-Language Validation
        env:
          ENV_VALIDATE_REPORT: ${{ github.workspace }}/env-report.json
          ENV_VALIDATE_SARIF: ${{ github.workspace }}/env-report.sarif
        run: |
          if [ -n "${{ secrets.DB_HOST }}" ]; then
            echo "🔐 Using real secrets"
            export DB_HOST="${{ secrets.DB_HOST }}"
            export API_KEY=*** secrets.API_KEY }}"
          else
            echo "🧪 Using test values (secrets not configured or in PR)"
            export DB_HOST="localhost"
            export API_KEY="test..."
          fi

          echo "🐍 Python validator..."
          python examples/validate.py
          python_exit=$?

          echo "🟨 Node.js validator..."
          node examples/validate.js
          node_exit=$?

          echo "🐚 Bash validator..."
          bash examples/validate.sh
          bash_exit=$?

          echo "📄 JSON Report:"
          cat env-report.json || true

          # 任何验证器失败则整体失败
          if [ $python_exit -ne 0 ] || [ $node_exit -ne 0 ] || [ $bash_exit -ne 0 ]; then
            echo "❌ Validation failed"
            exit 1
          fi

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ github.workspace }}/env-report.sarif
          validate: false

      - name: Notify Slack (optional)
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="❌ Failed"
          [ ${{ job.status }} == 'success' ] && STATUS="✅ Passed"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text": \"Env Validation ${STATUS} - ${GITHUB_REPOSITORY} @ ${GITHUB_REF_NAME}\"}"

      - name: Notify Discord (optional)
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STATUS="failed"
          [ ${{ job.status }} == 'success' ] && STATUS="success"
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"Env Validation ${STATUS} - ${GITHUB_REPOSITORY} @ ${GITHUB_REF_NAME}\"}"

  build-and-push:
    needs: manage-env
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
